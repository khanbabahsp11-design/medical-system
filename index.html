<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medical System V2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17212e;background:#eef2f6}*{box-sizing:border-box}body{margin:0}header{background:#0c6155;color:white;padding:18px 16px}header h1{margin:0;font-size:23px}header small{opacity:.85}main{max-width:950px;margin:auto;padding:12px}.tabs{display:flex;gap:6px;overflow:auto;padding:6px 0 12px}.tabs button{white-space:nowrap}.card{background:white;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0001}button{border:0;border-radius:8px;padding:11px 13px;background:#0c6155;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e6edf1;color:#17323c}button.danger{background:#a72f38}input,select{width:100%;padding:11px;border:1px solid #b8c6cf;border-radius:8px;font-size:16px;background:white}label{font-size:13px;color:#40515e;display:block;margin:9px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.muted{color:#657785;font-size:13px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border:1px solid #cbd5dc;padding:7px;text-align:left}th{background:#ffeb3b;color:#111}h2{font-size:19px;margin:0 0 12px}.big{font-size:21px;font-weight:750}.pill{display:inline-block;background:#fff3cb;padding:5px 8px;border-radius:6px}#invoice{display:none}.summary{background:#f3f8f6;padding:12px;border-radius:9px;margin-top:12px}.summary p{display:flex;justify-content:space-between;margin:7px 0}.smallbutton{padding:6px 9px;font-size:12px}.alert{background:#fff3d6;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px} @media(max-width:450px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}td,th{padding:5px;font-size:11px}}@media print{body{background:white}header,main,.tabs,.noprint{display:none!important}#invoice{display:block!important;padding:8mm;font:12px Arial;color:black}#invoice table{font-size:10px}#invoice th{background:#ffeb3b!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}#invoice h1{text-align:center;font-size:22px;margin:0}#invoice .foot{text-align:center;margin-top:35px}}
</style></head><body><header><h1>✚ Medical System</h1><small>Pharmacy billing · inventory · customer credit · V2 demo</small></header><main><div class="alert">Demo: Sample medicines and prices only. Data stays in this browser. Export backups regularly; do not use as the sole record for a real pharmacy.</div><nav class="tabs" id="tabs"><button data-tab="bill">New Bill</button><button data-tab="stock" class="secondary">Medicines</button><button data-tab="ledger" class="secondary">Credit Ledger</button><button data-tab="history" class="secondary">Sales</button><button data-tab="backup" class="secondary">Backup</button></nav><section id="screen"></section></main><article id="invoice"></article><script>
const KEY='medical_system_v2_demo';const seed=[{id:1,name:'Panadol 500mg',batch:'P102',barcode:'896100000001',expiry:'2027-12',qty:100,price:50},{id:2,name:'Brufen 200mg',batch:'B204',barcode:'896100000002',expiry:'2027-09',qty:65,price:120},{id:3,name:'ORS Sachet',batch:'O301',barcode:'896100000003',expiry:'2028-03',qty:80,price:35},{id:4,name:'Vitamin C Tablets',batch:'V415',barcode:'896100000004',expiry:'2027-11',qty:45,price:90}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.meds))state={meds:seed,bills:[],payments:[],nextBill:1};let cart=[],tab='bill';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'Rs. '+Number(n||0).toFixed(2);const num=n=>Math.max(0,Number(n)||0);const round=n=>Math.round((n+Number.EPSILON)*100)/100;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Storage unavailable. Please export your data.')}}function openTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.className=b.dataset.tab===t?'':'secondary');render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));function render(){({bill:renderBill,stock:renderStock,ledger:renderLedger,history:renderHistory,backup:renderBackup})[tab]()}function cartTotals(){let subtotal=0,lineDisc=0;cart.forEach(x=>{let base=x.qty*x.price;subtotal+=base;lineDisc+=Math.min(base,x.discType==='pct'?base*x.disc/100:x.disc)});let before=round(subtotal-lineDisc),type=$('overallType')?.value||'rs',val=num($('overallDiscount')?.value),overall=Math.min(before,type==='pct'?before*val/100:val);return {subtotal:round(subtotal),lineDisc:round(lineDisc),overall:round(overall),total:round(before-overall)}}function renderBill(){let options=state.meds.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.batch)} · ${money(m.price)} · Stock ${m.qty}</option>`).join('');$('screen').innerHTML=`<div class="card"><h2>New Pharmacy Bill</h2><div class="grid"><div><label>Customer name (required for credit)</label><input id="customer" placeholder="Walk-in Customer"></div><div><label>Phone (optional)</label><input id="phone" type="tel" placeholder="03xxxxxxxxx"></div></div><label>Find medicine by name / barcode / batch</label><input id="medSearch" placeholder="Search medicines"><label>Select medicine</label><select id="medicine">${options}</select><div class="grid3"><div><label>Quantity</label><input id="addQty" type="number" min="1" step="1" value="1"></div><div><label>Line discount</label><input id="addDisc" type="number" min="0" value="0"></div><div><label>Discount type</label><select id="addDiscType"><option value="rs">Rs.</option><option value="pct">%</option></select></div></div><div class="actions"><button onclick="addItem()">+ Add to Bill</button><button class="secondary" onclick="scanBarcode()">📷 Scan Barcode</button></div><p class="muted" id="scanStatus">Barcode camera scanning depends on Safari support; manual barcode search always works.</p></div><div class="card"><h2>Bill Items</h2><div class="scroll"><table><thead><tr><th>Sr</th><th>Medicine</th><th>Batch</th><th>Qty</th><th>Rate</th><th>Disc</th><th>Total</th><th></th></tr></thead><tbody id="cartRows"></tbody></table></div><div class="grid"><div><label>Bill discount</label><input id="overallDiscount" type="number" min="0" value="0" oninput="updateTotals()"></div><div><label>Discount type</label><select id="overallType" onchange="updateTotals()"><option value="rs">Rs.</option><option value="pct">%</option></select></div></div><div class="summary" id="totals"></div><label>Amount paid (Rs.)</label><input id="paid" type="number" min="0" value="0" oninput="updateTotals()"><div class="summary" id="paymentSummary"></div><div class="actions"><button onclick="saveBill()">Save Bill & Print / PDF</button><button class="secondary" onclick="cart=[];drawCart()">Clear Items</button></div></div>`;$('medSearch').oninput=()=>{let q=$('medSearch').value.toLowerCase();$('medicine').innerHTML=state.meds.filter(m=>[m.name,m.batch,m.barcode].some(x=>String(x).toLowerCase().includes(q))).map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.batch)} · ${money(m.price)} · Stock ${m.qty}</option>`).join('')};drawCart()}
function addItem(){let m=state.meds.find(x=>x.id===Number($('medicine').value));if(!m)return alert('Select a medicine');let qty=Number($('addQty').value),disc=num($('addDisc').value),discType=$('addDiscType').value;if(!Number.isInteger(qty)||qty<1)return alert('Enter a whole quantity');let existing=cart.filter(x=>x.id===m.id).reduce((s,x)=>s+x.qty,0);if(qty+existing>m.qty)return alert('Insufficient stock');if(discType==='pct'&&disc>100)return alert('Discount cannot exceed 100%');cart.push({id:m.id,name:m.name,batch:m.batch,qty,price:m.price,disc,discType});drawCart()}
function drawCart(){let rows=$('cartRows');if(!rows)return;rows.innerHTML=cart.map((x,i)=>{let base=x.qty*x.price,d=Math.min(base,x.discType==='pct'?base*x.disc/100:x.disc);return `<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.batch)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${x.disc}${x.discType==='pct'?'%':' Rs'}</td><td>${money(base-d)}</td><td><button class="danger smallbutton" onclick="cart.splice(${i},1);drawCart()">×</button></td></tr>`}).join('')||'<tr><td colspan="8">No medicines added</td></tr>';updateTotals()}
function updateTotals(){if(!$('totals'))return;let x=cartTotals(),paid=num($('paid').value);$('totals').innerHTML=`<p><span>Subtotal</span><b>${money(x.subtotal)}</b></p><p><span>Line discounts</span><b>${money(x.lineDisc)}</b></p><p><span>Bill discount</span><b>${money(x.overall)}</b></p><p><strong>Grand total</strong><strong>${money(x.total)}</strong></p>`;$('paymentSummary').innerHTML=`<p><span>Paid</span><b>${money(Math.min(paid,x.total))}</b></p><p><span>Remaining credit</span><b>${money(Math.max(0,x.total-paid))}</b></p><p><span>Change to return</span><b>${money(Math.max(0,paid-x.total))}</b></p><p><span>Status</span><b>${paid>=x.total?'PAID':paid===0?'FULL CREDIT':'PARTIAL PAID'}</b></p>`}
function saveBill(){if(!cart.length)return alert('Add medicines first');let x=cartTotals(),paid=num($('paid').value),customer=$('customer').value.trim()||'Walk-in Customer';if(paid<x.total&&customer.toLowerCase()==='walk-in customer')return alert('Enter a customer name for credit tracking');for(let c of cart){let m=state.meds.find(x=>x.id===c.id);if(!m||m.qty<c.qty)return alert('Stock changed. Please check your bill.')}let bill={number:state.nextBill++,date:new Date().toISOString(),customer,phone:$('phone').value.trim(),items:JSON.parse(JSON.stringify(cart)),...x,paid:round(Math.min(paid,x.total))};state.bills.push(bill);cart.forEach(c=>state.meds.find(m=>m.id===c.id).qty-=c.qty);save();printInvoice(bill);cart=[];renderBill();alert('Bill saved. Use Print / PDF to open iPhone print options.')}
function balance(b){return round(Math.max(0,b.total-b.paid-state.payments.filter(p=>p.bill===b.number).reduce((s,p)=>s+p.amount,0))}function printInvoice(b){let paid=round(b.total-balance(b));$('invoice').innerHTML=`<h1>MEDICAL SYSTEM</h1><p style="text-align:center">PHARMACY SALES INVOICE</p><hr><p><b>Bill #:</b> ${b.number} &nbsp; <b>Date:</b> ${new Date(b.date).toLocaleString('en-PK')}</p><p><b>Customer:</b> ${esc(b.customer)} &nbsp; <b>Phone:</b> ${esc(b.phone)}</p><table><thead><tr><th>Sr.</th><th>Medicine</th><th>Batch</th><th>Qty</th><th>Rate</th><th>Discount</th><th>Amount</th></tr></thead><tbody>${b.items.map((x,i)=>{let base=x.qty*x.price,d=Math.min(base,x.discType==='pct'?base*x.disc/100:x.disc);return `<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.batch)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${x.disc}${x.discType==='pct'?'%':' Rs'}</td><td>${money(base-d)}</td></tr>`}).join('')}</tbody></table><div style="margin-left:auto;max-width:280px"><p>Subtotal: ${money(b.subtotal)}</p><p>Line Discount: ${money(b.lineDisc)}</p><p>Bill Discount: ${money(b.overall)}</p><h3>Grand Total: ${money(b.total)}</h3><p>Paid: ${money(paid)}</p><h3>Remaining / Credit: ${money(balance(b))}</h3><p>Status: ${balance(b)===0?'PAID':paid===0?'FULL CREDIT':'PARTIAL PAID'}</p></div><p class="foot">Thank you for visiting!<br>Demo invoice · Add your store details before production use.</p>`;window.print()}
function renderStock(){ $('screen').innerHTML=`<div class="card"><h2>Medicine Inventory</h2><p class="muted">CSV columns: name,batch,barcode,expiry,qty,price. Import adds records; check duplicates manually.</p><input type="file" id="csv" accept=".csv,text/csv" onchange="importCSV(event)"><div class="grid3"><div><label>Medicine name</label><input id="mName"></div><div><label>Batch</label><input id="mBatch"></div><div><label>Barcode</label><input id="mBarcode"></div><div><label>Expiry (YYYY-MM)</label><input id="mExpiry" type="month"></div><div><label>Quantity</label><input id="mQty" type="number" min="0"></div><div><label>Unit price (Rs.)</label><input id="mPrice" type="number" min="0" step="0.01"></div></div><div class="actions"><button onclick="addMedicine()">Add Medicine</button></div></div><div class="card"><h2>Current Stock (${state.meds.length})</h2><div class="scroll"><table><thead><tr><th>Medicine</th><th>Batch</th><th>Barcode</th><th>Expiry</th><th>Qty</th><th>Price</th><th>Edit</th></tr></thead><tbody>${state.meds.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.batch)}</td><td>${esc(m.barcode)}</td><td>${esc(m.expiry)}</td><td>${m.qty}${m.qty<10?' ⚠️':''}</td><td>${money(m.price)}</td><td><button class="smallbutton" onclick="editMedicine(${m.id})">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addMedicine(){let name=$('mName').value.trim(),batch=$('mBatch').value.trim(),qty=Number($('mQty').value),price=Number($('mPrice').value);if(!name||!batch||!Number.isInteger(qty)||qty<0||!Number.isFinite(price)||price<0)return alert('Enter valid name, batch, quantity and price');state.meds.push({id:Date.now()+Math.random(),name,batch,barcode:$('mBarcode').value.trim(),expiry:$('mExpiry').value,qty,price});save();renderStock()}
function editMedicine(id){let m=state.meds.find(x=>x.id===id);let qty=prompt('New stock quantity for '+m.name,m.qty);if(qty===null)return;let price=prompt('New unit price',m.price);if(price===null)return;if(!Number.isInteger(Number(qty))||Number(qty)<0||!Number.isFinite(Number(price))||Number(price)<0)return alert('Invalid values');m.qty=Number(qty);m.price=Number(price);save();renderStock()}
function parseCSV(text){let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}function importCSV(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let rows=parseCSV(String(reader.result)),header=rows.shift().map(x=>x.trim().toLowerCase());if(!['name','batch','barcode','expiry','qty','price'].every(x=>header.includes(x)))return alert('CSV header must include name,batch,barcode,expiry,qty,price');let imported=0;for(let row of rows){let get=k=>String(row[header.indexOf(k)]||'').trim(),qty=Number(get('qty')),price=Number(get('price'));if(!get('name')||!get('batch')||!Number.isInteger(qty)||qty<0||!Number.isFinite(price)||price<0)continue;state.meds.push({id:Date.now()+Math.random(),name:get('name'),batch:get('batch'),barcode:get('barcode'),expiry:get('expiry'),qty,price});imported++}save();renderStock();alert(imported+' medicines imported')};reader.readAsText(file)}
function renderLedger(){let owing=state.bills.filter(b=>balance(b)>0);$('screen').innerHTML=`<div class="card"><h2>Customer Credit Ledger</h2><p class="big">Outstanding: ${money(owing.reduce((s,b)=>s+balance(b),0))}</p><div class="scroll"><table><thead><tr><th>Bill</th><th>Customer</th><th>Total</th><th>Paid</th><th>Remaining</th><th>Receive</th></tr></thead><tbody>${owing.map(b=>`<tr><td>#${b.number}</td><td>${esc(b.customer)}</td><td>${money(b.total)}</td><td>${money(b.total-balance(b))}</td><td>${money(balance(b))}</td><td><button class="smallbutton" onclick="receive(${b.number})">Payment</button></td></tr>`).join('')||'<tr><td colspan="6">No outstanding credit</td></tr>'}</tbody></table></div></div>`}
function receive(n){let b=state.bills.find(x=>x.number===n),due=balance(b),a=prompt('Receive payment (maximum '+money(due)+')',due);if(a===null)return;let amount=Number(a);if(!Number.isFinite(amount)||amount<=0||amount>due)return alert('Enter a valid payment not exceeding the balance');state.payments.push({bill:n,amount:round(amount),date:new Date().toISOString()});save();renderLedger()}
function renderHistory(){$('screen').innerHTML=`<div class="card"><h2>Saved Sales (${state.bills.length})</h2><div class="scroll"><table><thead><tr><th>Bill</th><th>Date</th><th>Customer</th><th>Total</th><th>Remaining</th><th>Print</th></tr></thead><tbody>${[...state.bills].reverse().map(b=>`<tr><td>#${b.number}</td><td>${new Date(b.date).toLocaleDateString('en-PK')}</td><td>${esc(b.customer)}</td><td>${money(b.total)}</td><td>${money(balance(b))}</td><td><button class="smallbutton" onclick="reprint(${b.number})">PDF/Print</button></td></tr>`).join('')||'<tr><td colspan="6">No sales yet</td></tr>'}</tbody></table></div></div>`}function reprint(n){let b=state.bills.find(x=>x.number===n);if(b)printInvoice(b)}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function renderBackup(){$('screen').innerHTML=`<div class="card"><h2>Backup & Restore</h2><p>Export a JSON backup of medicines, bills and customer payments. Keep it in a secure place.</p><div class="actions"><button onclick="download('medical-system-backup.json',JSON.stringify(state,null,2),'application/json')">Export Full Backup</button><button class="secondary" onclick="download('medicine-stock.csv','name,batch,barcode,expiry,qty,price\\n'.replace('\\n','\n')+state.meds.map(m=>[m.name,m.batch,m.barcode,m.expiry,m.qty,m.price].map(v=>'\"'+String(v??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\n'),'text/csv')">Export Stock CSV</button></div><label>Restore JSON backup (replaces current data)</label><input type="file" accept=".json,application/json" onchange="restoreBackup(event)"><p class="muted">GitHub Pages is public hosting for app code, not a private online database. This demo uses local browser storage only.</p></div>`}function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data.meds)||!Array.isArray(data.bills)||!Array.isArray(data.payments)||!Number.isInteger(data.nextBill))throw Error();if(!confirm('Replace all current records with this backup?'))return;state=data;save();render();alert('Backup restored')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}async function scanBarcode(){if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia)return $('scanStatus').textContent='Camera scanning is not supported in this browser. Type barcode into search instead.';let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.srcObject=stream;video.style='width:100%;max-height:220px';$('scanStatus').replaceChildren(video);await video.play();let detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a']});let found=false;for(let i=0;i<70&&!found;i++){await new Promise(r=>setTimeout(r,150));let codes=await detector.detect(video);if(codes.length){$('medSearch').value=codes[0].rawValue;$('medSearch').dispatchEvent(new Event('input'));found=true}}$('scanStatus').textContent=found?'Barcode read; select the matching medicine.':'No barcode detected. Enter the number manually.'}catch(e){$('scanStatus').textContent='Camera unavailable. Enter barcode manually.'}finally{stream?.getTracks().forEach(t=>t.stop())}}render();
</script></body></html>
